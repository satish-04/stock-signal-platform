apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-signal-app
      component: postgres
  template:
    metadata:
      labels:
        app: stock-signal-app
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: stock-signal-app-secrets
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: stock-signal-app-secrets
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stock-signal-app-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stock-signal-app-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: postgres
spec:
  selector:
    app: stock-signal-app
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP