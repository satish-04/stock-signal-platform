apiVersion: v1
kind: Secret
metadata:
  name: stock-signal-app-secrets
  namespace: stock-signal-app
type: Opaque
stringData:
  # Database credentials
  DB_HOST: postgres.stock-signal-app.svc.cluster.local
  DB_PORT: "5432"
  DB_USER: stock_signal
  DB_NAME: stock_signal
  
  # Redis credentials  
  REDIS_HOST: redis.stock-signal-app.svc.cluster.local
  REDIS_PORT: "6379"
  
  # Application secrets
  SECRET_KEY: change-me-in-production-use-a-strong-secret-key-here
  DJANGO_ALLOWED_HOSTS: "stock-signal-app.example.com,localhost"
  
  # Trading credentials
  TWS_HOST: tws.stock-signal-app.svc.cluster.local
  TWS_PORT: "7497"
  
  # API keys (should be injected via external secrets manager in production)
  ANTHROPIC_API_KEY: sk-ant-api01-placeholder-for-production
  
  # IBKR API credentials
  IB_API_CLIENT_ID: your-client-id-here
  IB_API_SECRET: your-secret-here

---
