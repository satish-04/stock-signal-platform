apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-signal-app
      component: frontend
  template:
    metadata:
      labels:
        app: stock-signal-app
        component: frontend
    spec:
      containers:
        - name: frontend
          image: your-docker-registry/stock-signal-app-frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: frontend
spec:
  selector:
    app: stock-signal-app
    component: frontend
  ports:
    - port: 3000
      targetPort: 80
      name: http
  type: ClusterIP