apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-signal-app
      component: redis
  template:
    metadata:
      labels:
        app: stock-signal-app
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          args:
            - --maxmemory-policy=allkeys-lru
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: redis
spec:
  selector:
    app: stock-signal-app
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP