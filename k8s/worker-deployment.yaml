apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-signal-app
      component: worker
  template:
    metadata:
      labels:
        app: stock-signal-app
        component: worker
    spec:
      containers:
        - name: worker
          image: your-docker-registry/stock-signal-app:latest
          envFrom:
            - secretRef:
                name: stock-signal-app-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          command:
            - python
            - -m
            - app.workers.market_data_worker
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import requests; requests.get('http://localhost:8000/health')"
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: stock-signal-app
  labels:
    app: stock-signal-app
    component: worker
spec:
  selector:
    app: stock-signal-app
    component: worker
  type: ClusterIP