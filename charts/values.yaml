# Default values for stock-signal-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: stock-signal-app
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8000

frontendService:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: "500m"
    memory: 1Gi
  requests:
    cpu: "100m"
    memory: 256Mi

frontendResources:
  limits:
    cpu: "500m"
    memory: 1Gi
  requests:
    cpu: "100m"
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Database configuration
database:
  host: postgres.stock-signal-app.svc.cluster.local
  port: 5432
  name: stock_signal
  username: stock_signal

# Redis configuration  
redis:
  host: redis.stock-signal-app.svc.cluster.local
  port: 6379

# Trading configuration
trading:
  mode: paper
  marketDataMode: mock
  enableOrderSubmission: false

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: stock-signal-app.example.com
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
  tls:
    - secretName: stock-signal-app-tls
      hosts:
        - stock-signal-app.example.com

# Secrets configuration
secrets:
  # These values should be overridden via values-prod.yaml or secrets manager
  secretKey: "change-me-in-production"
  anthropicApiKey: "sk-ant-api01-placeholder"

# Persistence
persistence:
  postgresql:
    enabled: true
    existingClaim: ""
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  redis:
    enabled: true
    existingClaim: ""
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Monitoring
monitoring:
  enabled: true
  scrapeInterval: 30s