# Production values for Stock Signal App Helm Chart
# This file contains production-ready configurations

replicaCount: 3

image:
  repository: your-docker-registry/stock-signal-app
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

frontendService:
  type: LoadBalancer  # Change to ClusterIP if using ingress
  port: 3000

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: "500m"
    memory: 1Gi

frontendResources:
  limits:
    cpu: "500m"
    memory: 1Gi
  requests:
    cpu: "100m"
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# Database configuration
database:
  host: stock-signal-app-postgresql.stock-signal-app.svc.cluster.local
  port: 5432
  name: stock_signal_prod
  username: stock_signal

# Redis configuration  
redis:
  host: stock-signal-app-redis.stock-signal-app.svc.cluster.local
  port: 6379

# Trading configuration - SECURITY WARNING: Only enable for production
trading:
  mode: paper  # Set to 'live' ONLY when fully tested and approved
  marketDataMode: real
  enableOrderSubmission: false

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: stock-signal-app.example.com
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
  tls:
    - secretName: stock-signal-app-prod-tls
      hosts:
        - stock-signal-app.example.com

# Secrets configuration
secrets:
  # Load from environment or secrets manager in production
  secretKey: ${SECRET_KEY}
  anthropicApiKey: ${ANTHROPIC_API_KEY}

# Persistence
persistence:
  postgresql:
    enabled: true
    existingClaim: ""
    size: 10Gi
    storageClass: premium-rwo
    accessMode: ReadWriteOnce

  redis:
    enabled: true
    existingClaim: ""
    size: 2Gi
    storageClass: premium-rwo
    accessMode: ReadWriteOnce

# Monitoring configuration
monitoring:
  enabled: true
  scrapeInterval: 15s

# Node selector for production workloads
nodeSelector:
  kubernetes.io/os: linux

# Tolerations for production nodes
tolerations: []

# Affinity rules for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: stock-signal-app
          topologyKey: kubernetes.io/hostname