apiVersion: v1
kind: ServiceMonitor
metadata:
  name: {{ include "stock-signal-app.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-signal-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "stock-signal-app.fullname" . }}-backend
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      interval: {{ .Values.monitoring.scrapeInterval }}
      path: /metrics
      scheme: http

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: {{ include "stock-signal-app.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-signal-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "stock-signal-app.fullname" . }}-frontend
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      interval: {{ .Values.monitoring.scrapeInterval }}
      path: /metrics
      scheme: http

---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "stock-signal-app.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-signal-app.labels" . | nindent 4 }}
spec:
  groups:
    - name: stock-signal-app.rules
      rules:
        - alert: BackendHighErrorRate
          expr: |
            sum(rate(http_requests_total{app="{{ include "stock-signal-app.fullname" . }}-backend", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{app="{{ include "stock-signal-app.fullname" . }}-backend"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High error rate in backend service"
            description: "Error rate is above 5% for {{ include "stock-signal-app.fullname" . }}-backend"

        - alert: FrontendHighErrorRate
          expr: |
            sum(rate(http_requests_total{app="{{ include "stock-signal-app.fullname" . }}-frontend", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{app="{{ include "stock-signal-app.fullname" . }}-frontend"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High error rate in frontend service"
            description: "Error rate is above 5% for {{ include "stock-signal-app.fullname" . }}-frontend"

        - alert: HighMemoryUsage
          expr: |
            container_memory_usage_bytes{container=~"backend|frontend", namespace="{{ .Release.Namespace }}"}
            / container_spec_memory_limit_bytes{container=~"backend|frontend", namespace="{{ .Release.Namespace }}"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Memory usage is above 80% for container"

        - alert: PodCrashLooping
          expr: |
            rate(container_last{container=~"backend|frontend", namespace="{{ .Release.Namespace }}", status!="running"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod is crash looping"
            description: "Container {{ $labels.container }} is repeatedly crashing"

