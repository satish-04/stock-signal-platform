[project]
name = "stock-signal-platform"
version = "0.3.0"
description = "Local enterprise-grade stock news and options signal platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5.2,<6",
  "httpx>=0.28,<1",
  "anthropic>=0.45,<1",
  "prometheus-client>=0.21,<1",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "python-json-logger>=3.2,<4",
  "cryptography>=44,<46",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "coverage>=7.6,<8",
]
ibkr = ["ibapi>=9.81.1.post1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
